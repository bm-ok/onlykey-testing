# Section 1 on a hosted runner.
#
# ============================ UNTESTED ============================
# This has never run. It is written from what is known to work on a
# workstation - the same commands, in the same order - but nothing here has
# been executed by GitHub, and a workflow that has not run is a guess.
#
# It is therefore DISABLED: `workflow_dispatch` only, no push or pull_request
# trigger. Turning it on means adding those triggers, and doing that before it
# has passed once by hand would put a red X on every commit for reasons that
# have nothing to do with the commits.
#
# It has still never run ON GITHUB. What has happened is that every step was
# simulated locally against a clean tree - no .stage, no sources.gypi, no
# build/, no node_modules - and four defects were found and fixed that way:
#
#   1. EMULATOR_REPO pointed at bm-ok/node-onlykey-emulator, which does not
#      exist. The emulator is bmatusiak/node-onlykey-emulator.
#   2. `npm install` in emulator/ cannot work: package.json sets
#      "gypfile": true, so npm runs node-gyp itself before scripts/stage.js has
#      generated sources.gypi, which binding.gyp includes on its first line.
#      Reproduced from a clean tree; it dies in gyp configure.
#   3. `npm run build` has no configure step, so it wants a Makefile a fresh
#      tree does not have. `npm run rebuild` is stage, configure, build.
#   4. The Teensy core was never checked out at all. stage.js needs FOUR trees
#      and this workflow provided three, so it would have stopped at
#      `stage: missing required tree`.
#
# With 1-4 fixed the addon builds from a clean tree locally. What is still
# unverified is everything GitHub-specific: the runner image, the sysctl, the
# sparse checkout, the artifact upload. So the triggers stay off until this has
# gone green by hand at least once.
# ==================================================================
#
# What can run here, and why nothing else can: a hosted runner has no USB, no
# kernel HID device and no display. That rules out node-hid, python-onlykey,
# lib-agent, the web app and the desktop app - sections 2, 3 and 4 are not
# deferred here, they are impossible. What survives is exactly the tests that
# reach the device inside this process, over the emulator's in-memory HID bus.

name: protocol (section 1)

on:
  workflow_dispatch:
    inputs:
      target:
        description: what to run
        default: 01-protocol
        required: false

# Repositories, all from the same owner as this kit. The emulator is the parent
# checkout; the firmware and libraries are what it compiles.
env:
  EMULATOR_REPO: bmatusiak/node-onlykey-emulator
  FIRMWARE_REPO: bm-ok/OnlyKey-Firmware
  LIBRARIES_REPO: bm-ok/0c-coder-libraries
  TEENSY_REPO: bm-ok/arduino-1.6.5-r5-teensy_127

jobs:
  section-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: check out the test kit
        uses: actions/checkout@v4
        with:
          path: onlykey/onlykey-testing

      # The kit finds the emulator at ../../emulator relative to its own root,
      # so the tree has to be assembled in that shape - or OKEMU_ROOT has to
      # say otherwise. Assembling it keeps one code path.
      - name: check out the emulator
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EMULATOR_REPO }}
          path: emulator-repo

      - name: check out the firmware sources
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          path: onlykey/OnlyKey-Firmware

      - name: check out the libraries
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIBRARIES_REPO }}
          path: onlykey/libraries

      # FOUR trees, not three. stage.js refuses to run without this one -
      # `stage: missing required tree` - and it is easy to miss because the
      # emulator never mentions Teensy anywhere a reader would look: the tree is
      # the stock Arduino/Teensy 3 core that OnlyKey's own *.c and *.h are copied
      # OVER. Only two paths inside it are used, so the checkout is narrowed to
      # them rather than pulling the whole thing, which is large:
      #
      #   .../cores/teensy3       staged first, then shadowed by OnlyKey-Firmware
      #   .../libraries           read by gen-sources.js
      #
      # See README, "The firmware sources, and which copy compiles".
      - name: check out the Teensy core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TEENSY_REPO }}
          path: onlykey/arduino-1.6.5-r5-teensy_127
          sparse-checkout: |
            arduino-1.6.5-r5/hardware/teensy/avr/cores/teensy3
            arduino-1.6.5-r5/hardware/teensy/avr/libraries
          sparse-checkout-cone-mode: false

      - name: put the emulator where the kit expects it
        run: mv emulator-repo/emulator ./emulator

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # THE setting. At the unprivileged default (65536) the device boots and
      # answers HID and only segfaults once it encrypts something - so a run
      # that skips this looks healthy right up until the first test that stores
      # a PIN. 4096 maps certified_hw at 0x5BB0 and leaves page zero unmapped,
      # so a genuine NULL dereference still faults.
      - name: lower vm.mmap_min_addr
        run: sudo sysctl -w vm.mmap_min_addr=4096

      # --ignore-scripts is REQUIRED here, not a preference. package.json has
      # `"gypfile": true`, so a plain `npm install` makes npm run `node-gyp
      # rebuild` on its own - and binding.gyp opens with
      # `"includes": ["sources.gypi"]`, a file that scripts/stage.js has not
      # generated yet. Both it and .stage/ are gitignored, so a fresh checkout
      # has neither and the install dies in gyp configure before `npm run build`
      # is ever reached.
      #
      # `rebuild` rather than `build` for the same class of reason: `build` is
      # `stage && node-gyp build`, with no configure, so it wants a Makefile that
      # a fresh tree does not have. `rebuild` is stage, configure, build.
      #
      # Verified from a clean tree - .stage, sources.gypi, build/ and
      # node_modules all removed - where `npm install` fails and this succeeds.
      - name: build the emulator addon
        working-directory: emulator
        run: |
          npm install --ignore-scripts
          npm run rebuild

      # The kit's own dependencies are all optional, and this is the step that
      # decides whether the X-Wing tests RUN here or skip themselves politely.
      #
      # --ignore-scripts is deliberate: node-hid is in the same optional group
      # and would run node-gyp rebuild, which wants libudev and takes minutes to
      # produce a binding for a hardware adapter that cannot work on a runner
      # with no USB. The @noble packages are pure JS and need no build step.
      - name: install the kit's optional dependencies
        working-directory: onlykey/onlykey-testing
        run: npm install --ignore-scripts

      # Assert BEFORE running anything, because both of these fail in ways that
      # do not look like themselves.
      #
      # The rung: get it wrong and every crypto test fails looking like a
      # firmware bug.
      #
      # xwing-math: get it wrong and nothing fails at all - the file skips
      # itself with a reason, the run is green, and the one carried-over test
      # this runner CAN do quietly did not happen. A skip is honest when a
      # capability is genuinely out of reach here (no USB, no display); it is
      # not honest for three pure-JS packages that just were not installed.
      - name: assert the rung, and that the maths can run
        working-directory: onlykey/onlykey-testing
        run: |
          node bin/okt.js caps
          node -e '
            const { detect } = require("./lib/capabilities");
            const caps = detect({ adapter: "emulated" });
            for (const name of ["crypto", "xwing-math"]) {
              if (!caps.has(name)) {
                console.error("cannot run here - " + name + ": " + caps.why(name));
                process.exit(1);
              }
            }
            console.log("rung ok: " + caps.rung.name);
          '

      # The sanity section first, and unconditionally: no device, no fixtures,
      # a second of wall clock. If the kit's own oracles disagree with their
      # known answers, nothing section 1 goes on to say about the device can be
      # trusted anyway.
      - name: run the sanity section
        working-directory: onlykey/onlykey-testing
        run: node bin/okt.js run 00-sanity

      - name: list what will run
        working-directory: onlykey/onlykey-testing
        run: node bin/okt.js list ${{ inputs.target || '01-protocol' }}

      # The exit code IS the verdict - 0 passed, 1 a test failed, 2 firmware
      # crash, 3 watchdog, 4 runner error, 5 the device host died. Nothing here
      # greps the log to decide.
      - name: run section 1
        working-directory: onlykey/onlykey-testing
        run: node bin/okt.js run ${{ inputs.target || '01-protocol' }}

      # Always: a failed run is exactly when the log and the status file matter,
      # and each run directory carries its own device output and failure blocks.
      - name: keep the run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: onlykey/onlykey-testing/runs/
          retention-days: 14

      # Sections 2-4 are not skipped here for convenience. Saying so in the job
      # summary means nobody has to read the source to find out why a green run
      # covered a third of the tree.
      - name: say what a hosted runner cannot do
        if: always()
        run: |
          {
            echo "### Not run here, and not runnable here"
            echo ""
            echo "A hosted runner has no USB, no kernel HID device and no display."
            echo ""
            echo "| section | why |"
            echo "|---|---|"
            echo "| 02-cli | python-onlykey finds the device through hidapi; there is no /dev/hidraw |"
            echo "| 03-gui | the web app needs a browser and a display |"
            echo "| 04-app | the desktop app needs both, plus the browser WebAuthn stack |"
            echo ""
            echo "These belong to a self-hosted runner or a workstation."
          } >> "$GITHUB_STEP_SUMMARY"
